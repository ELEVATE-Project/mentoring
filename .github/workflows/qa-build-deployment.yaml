name: Manual Build and Deploy Mentoring Service (BRAC)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select deployment environment"
        required: true
        type: choice
        options:
          - qa
          - production
      tag:
        description: "Docker image tag (example: v1.2.3)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # ============================================================
  # PREPARE: validate tag, compute lowercase GHCR image name
  # ============================================================
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Validate tag and compute image name
        id: vars
        env:
          TAG: ${{ inputs.tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Invalid tag '${TAG}'. Expected format: v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          # GHCR requires a lowercase image path
          IMAGE="ghcr.io/${OWNER,,}/brac-elevate-mentoring"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  # ============================================================
  # QA: BUILD (native per-arch, push by digest)
  # ============================================================
  build-qa:
    name: Build (${{ matrix.platform }})
    if: inputs.environment == 'qa'
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            pair: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            pair: linux-arm64
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.pair }}
          cache-to: type=gha,scope=${{ matrix.pair }},mode=min

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ============================================================
  # QA: MERGE per-arch images into one multi-arch tag
  # ============================================================
  merge-qa:
    name: Create Multi-Arch Manifest
    if: inputs.environment == 'qa'
    needs: [prepare, build-qa]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Show image information
        run: |
          echo "Environment: QA"
          docker buildx imagetools inspect "${IMAGE}:${TAG}"

  # ============================================================
  # QA: DEPLOY
  # ============================================================
  deploy-qa:
    name: Deploy to QA
    if: inputs.environment == 'qa'
    needs: [prepare, merge-qa]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: brac-mentoring-deploy-qa
      cancel-in-progress: false
    # Secrets below come from the "qa" environment
    environment:
      name: qa
    permissions:
      contents: read
    steps:
      - name: Deploy to QA Server
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          ENV_BRAC: ${{ secrets.ENV_BRAC }}
          TARGET_DIR: ${{ secrets.TARGET_DIR }}
          DEPLOY_TAG: ${{ needs.prepare.outputs.tag }}
        with:
          host: ${{ secrets.HOST_NAME }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: GHCR_USERNAME,GHCR_TOKEN,ENV_BRAC,TARGET_DIR,DEPLOY_TAG
          script: |
            set -euo pipefail

            echo "Deploying BRAC Mentoring Service | Environment: QA | Tag: ${DEPLOY_TAG}"

            cd "${TARGET_DIR}"

            if [ -f .env ]; then
              cp .env .env-bkp
            fi

            printf '%s\n' "${ENV_BRAC}" > .env
            chmod 600 .env

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin

            ./deploy.sh "${DEPLOY_TAG}"

  # ============================================================
  # PRODUCTION: VALIDATE EXISTING IMAGE + DEPLOY (no rebuild)
  # ============================================================
  deploy-production:
    name: Deploy to Production
    if: inputs.environment == 'production'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: brac-mentoring-deploy-production
      cancel-in-progress: false
    # Secrets below come from the "production" environment
    environment:
      name: production
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate image exists and is multi-arch
        run: |
          set -euo pipefail
          echo "Validating ${IMAGE}:${TAG}"
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
          echo "Image exists. No image will be built."

      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          ENV_BRAC: ${{ secrets.ENV_BRAC }}
          TARGET_DIR: ${{ secrets.TARGET_DIR }}
          DEPLOY_TAG: ${{ needs.prepare.outputs.tag }}
        with:
          host: ${{ secrets.HOST_NAME }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: GHCR_USERNAME,GHCR_TOKEN,ENV_BRAC,TARGET_DIR,DEPLOY_TAG
          script: |
            set -euo pipefail

            echo "Deploying BRAC Mentoring Service | Environment: PRODUCTION | Tag: ${DEPLOY_TAG}"

            cd "${TARGET_DIR}"

            if [ -f .env ]; then
              cp .env .env-bkp
            fi

            printf '%s\n' "${ENV_BRAC}" > .env
            chmod 600 .env

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin

            ./deploy.sh "${DEPLOY_TAG}"

            echo "Production deployment completed | Tag: ${DEPLOY_TAG}"
